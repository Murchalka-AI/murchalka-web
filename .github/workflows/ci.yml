name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify production assets
        run: test -s dist/index.html && test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
      - name: Verify production container
        run: docker build --tag murchalka-web:ci .
