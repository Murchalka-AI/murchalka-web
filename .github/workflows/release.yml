name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish
        required: true
        type: string
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false, ref: "${{ inputs.release_tag || github.ref }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "value=${RELEASE_TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: test "$(node --print 'require("./package.json").version')" = "${RELEASE_VERSION}"
      - name: Reject an existing immutable release
        env: { GH_TOKEN: "${{ github.token }}", RELEASE_TAG: "${{ steps.version.outputs.tag }}" }
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists and remains immutable." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Package React shell
        shell: bash
        run: |
          mkdir -p "artifacts/murchalka-web-${{ steps.version.outputs.value }}"
          cp -R dist/. "artifacts/murchalka-web-${{ steps.version.outputs.value }}/"
          cp README.md SECURITY.md "artifacts/murchalka-web-${{ steps.version.outputs.value }}/"
          (cd artifacts && zip -X -r "murchalka-web-${{ steps.version.outputs.value }}.zip" "murchalka-web-${{ steps.version.outputs.value }}")
          (cd artifacts && sha256sum *.zip > SHA256SUMS)
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'artifacts/*.zip' }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: Reject an existing immutable image tag
        run: |
          image="ghcr.io/murchalka-ai/murchalka-web:${{ steps.version.outputs.value }}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "Container image tag already exists and remains immutable." >&2
            exit 1
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/murchalka-ai/murchalka-web:${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
      - env: { GH_TOKEN: "${{ github.token }}", RELEASE_TAG: "${{ steps.version.outputs.tag }}" }
        run: gh release create "${RELEASE_TAG}" artifacts/*.zip artifacts/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
